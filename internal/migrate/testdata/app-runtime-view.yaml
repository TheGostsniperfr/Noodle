  - {id: caller-app, kind: external, icon: k8s-deploy, title: "Other app backend", tech: "[any app namespace]", desc: "Calls $<APP>_URL/api", x: 60, y: 580, w: 240, h: 90}

  - {id: envoy-eg, kind: backend, icon: envoy, title: "eg · north-south", tech: "[OIDC + groups_direct check]", desc: "Public *.staging hostnames", x: 450, y: 380, w: 280, h: 110}
  - {id: envoy-eg-internal, kind: backend, icon: envoy, title: "eg-internal · east-west", badge: G1, tech: "[ClusterIP 10.96.0.100]", desc: "Same hostnames, /api only", x: 450, y: 560, w: 280, h: 110}

  - {id: app-frontend, kind: frontend, icon: k8s-deploy, title: "<app>-frontend", badge: G3, tech: "[Deployment · nginx SPA]", desc: "Static UI, no server logic", x: 880, y: 350, w: 260, h: 90}
  - {id: app-backend, kind: backend, icon: k8s-deploy, title: "<app>-backend", badge: "G3 G4", tech: "[Deployment · FastAPI · uid 1000]", desc: "Team code: API + business rules", x: 880, y: 500, w: 260, h: 130}
  - {id: app-db, kind: database, shape: cylinder, icon: cnpg, title: "<app>-db", badge: G5, tech: "[CNPG · owner <app>]", desc: "The only DB the app reaches", x: 1300, y: 470, w: 240, h: 130}
  - {id: app-secrets, kind: database, icon: k8s-secret, title: "Secrets", tech: "[K8s Secret · env only]", desc: "<app>-db-app · <app>-<entry>", x: 1260, y: 690, w: 240, h: 90}
