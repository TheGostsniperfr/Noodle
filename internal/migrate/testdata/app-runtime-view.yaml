id: app-runtime-view
title: "Acme · staging · Application runtime view"
subtitle: "Seen from inside an application's pods: who can reach it, what it can reach, and what the platform hands it."
meta:
  - "Scope: one business app deployed with generic-app-chart + secure-route, staging, as of 2026-09-27 · derived from code and checked live on ticketing"
  - "Out of scope: the edge team edge and TLS (see platform-staging) · OIDC login sequence · CI pipeline · BI extraction · prod differences (2+ replicas, 3 DB instances)"
  - "v0.1 · source: examples/platform-regression/app-runtime-view.yaml · anonymized from a real platform, kept as a regression fixture"
width: 2840
height: 1820

zones:
  - {id: z-callers, kind: region, color: slate, icon: globe, label: "CALLERS", x: 40, y: 220, w: 280, h: 640}
  - {id: z-cluster, kind: region, color: cyan, icon: talos, label: "ACME STAGING CLUSTER", sub: "Cilium default-deny · every allowed flow is explicit", x: 380, y: 220, w: 1920, h: 1110}
  - {id: g-gateway, kind: group, color: emerald, icon: envoy-gateway, label: "GATEWAY API", sub: "ns envoy-gateway", x: 420, y: 290, w: 340, h: 440}
  - {id: g-app, kind: group, color: indigo, icon: k8s-ns, label: "NAMESPACE <app>", sub: "owned by the app team · 1 replica in staging", x: 840, y: 290, w: 900, h: 720}
  - {id: g-deps, kind: group, color: sky, icon: cilium, label: "REACHABLE DEPENDENCIES", sub: "egress allowed by the app's CNP", x: 1820, y: 290, w: 440, h: 720}
  - {id: g-controllers, kind: group, color: violet, icon: kubernetes, label: "PLATFORM CONTROLLERS", x: 840, y: 1080, w: 1420, h: 220}
  - {id: g-denied, kind: group, color: rose, icon: cilium, label: "DENIED DESTINATIONS", sub: "no allow rule", x: 2360, y: 290, w: 440, h: 790}

nodes:
