edges:
  # Data plane: a signed-in user calls app A, whose backend calls app B.
  - {id: e-1-user-edge, kind: flow, from: user, to: edge-ingress, port: "TCP 443", label: "[1] GET · HTTPS", path: [[180, 470], [390, 470]]}
  - {id: e-2-edge-eg, kind: flow, from: edge-ingress, to: envoy-eg, port: "TCP 30080", label: "[2] forward · HTTP", label_offset: [0, -22], path: [[650, 470], [830, 470]]}
  - {id: e-3-eg-a-backend, kind: flow, from: envoy-eg, to: a-backend, port: "TCP 8000", label: "[3] /api · HTTP", label_at: [1170, 560], path: [[1110, 515], [1170, 515], [1170, 600], [1290, 600]]}
  - {id: e-4-a-backend-a-db, kind: flow, from: a-backend, to: a-db, port: "TCP 5432", label: "[4] query · SQL", path: [[1540, 590], [1700, 590]]}
  - {id: e-5-a-backend-eg-internal, kind: flow, from: a-backend, to: envoy-eg-internal, port: "TCP 80", against_flow: true, label: "[5] GET $APP_B_URL/api · HTTP", label_at: [1200, 700], path: [[1290, 625], [1200, 625], [1200, 760], [1110, 760]]}
  - {id: e-6-eg-internal-b-backend, kind: flow, from: envoy-eg-internal, to: b-backend, port: "TCP 8000", label: "[6] /api · HTTP", label_at: [1230, 830], path: [[1110, 800], [1230, 800], [1230, 860], [1290, 860]]}
  - {id: e-7-b-backend-b-db, kind: flow, from: b-backend, to: b-db, port: "TCP 5432", label: "[7] query · SQL", path: [[1540, 835], [1700, 835]]}
  - {id: e-eg-a-frontend, kind: flow, from: envoy-eg, to: a-frontend, port: "TCP 80", label: "/ SPA · HTTP", label_at: [1200, 480], path: [[1110, 480], [1290, 480]]}

  # What Cilium drops between and inside app namespaces.
  - {id: x-a-frontend-a-backend, kind: blocked, from: a-frontend, to: a-backend, label: "frontend pod to backend · denied", label_offset: [130, 0], path: [[1415, 500], [1415, 550]]}
  - {id: x-a-backend-b-db, kind: blocked, from: a-backend, to: b-db, label: "cross-app DB · denied", label_at: [1640, 705], path: [[1500, 640], [1500, 705], [1760, 705], [1760, 770]]}
  - {id: x-app-a-app-b, kind: blocked, from: g-app-a, to: g-app-b, label: "direct pod-to-pod · denied", label_offset: [-110, 0], path: [[2150, 670], [2150, 740]]}

  # Authentication (order lives in a separate OIDC sequence diagram).
  - {id: e-oidc-eg-gitlab, kind: auth, from: envoy-eg, to: gitlab-oidc, port: "TCP 443", label: "OIDC code exchange + JWKS · HTTPS", label_at: [845, 1475], path: [[845, 540], [845, 1590]]}

  # Control plane: from a git push to a running pod.
  - {id: e-a-dev-repos, kind: flow, from: developer, to: gitlab-repos, port: "TCP 22", label: "[A] git push · SSH", path: [[180, 1730], [1230, 1730], [1230, 1660], [1260, 1660]]}
  - {id: e-b-updater-registry, kind: async, from: image-updater, to: gitlab-registry, port: "TCP 443", label: "[B] poll rc tags · HTTPS", label_at: [1720, 1470], path: [[1720, 1270], [1720, 1590]]}
  - {id: e-c-updater-repos, kind: async, from: image-updater, to: gitlab-repos, port: "TCP 22", label: "[C] write tag · SSH", label_at: [1540, 1480], path: [[1600, 1270], [1600, 1480], [1480, 1480], [1480, 1590]]}
  - {id: e-d-argocd-repos, kind: async, from: argocd, to: gitlab-repos, port: "TCP 22", label: "[D] pull · SSH", label_at: [1390, 1440], path: [[1390, 1270], [1390, 1590]]}
  - {id: e-e-nodes-registry, kind: async, from: z-cluster, to: gitlab-registry, port: "TCP 443", label: "[E] image pull · HTTPS", label_at: [1870, 1475], path: [[1870, 1420], [1870, 1590]]}
  - {id: e-f-vso-vault, kind: async, from: vso, to: vault, port: "TCP 8200", label: "[F] read", label_offset: [0, -24], path: [[2190, 1235], [2280, 1235]]}

  # BI extraction (background).
  - {id: e-g-dagster-airbyte, kind: async, from: dagster, to: airbyte, port: "TCP 8001", label: "[G] trigger", label_offset: [0, -22], path: [[2550, 500], [2660, 500]]}
  - {id: e-h-airbyte-a-db, kind: async, from: airbyte, to: a-db, port: "TCP 5432", against_flow: true, label: "[H] extract replica · SQL (bi_reader)", label_at: [2100, 575], path: [[2690, 520], [2690, 575], [1940, 575]]}
  - {id: e-i-airbyte-warehouse, kind: async, from: airbyte, to: bi-warehouse, port: "TCP 5432", label: "[I] load", label_offset: [0, -22], path: [[2890, 480], [3010, 480]]}
  - {id: e-metabase-warehouse, kind: flow, from: metabase, to: bi-warehouse, port: "TCP 5432", label: "query · SQL", label_at: [2950, 600], path: [[2890, 665], [2950, 665], [2950, 530], [3010, 530]]}

  # Admin access.
  - {id: e-admin-boundary, kind: auth, from: admin, to: boundary, label: "login · OIDC", path: [[180, 1610], [400, 1610]]}
  - {id: e-boundary-apiserver, kind: tunnel, from: boundary, to: kube-apiserver, port: "TCP 6443", label: "brokered session · TCP", label_at: [705, 1300], path: [[680, 1630], [705, 1630], [705, 1075], [1100, 1075], [1100, 1160]]}

  # Object references.
  - {id: r-argocd-app-b, kind: link, from: argocd, to: g-app-b, label: "applies", path: [[1480, 1170], [1480, 1020]]}
  - {id: r-cnpg-apps, kind: link, from: cnpg-operator, to: g-apps, label: "reconciles", label_at: [2290, 960], path: [[2360, 925], [2290, 925], [2290, 1000], [2250, 1000]]}

notes:
  - {id: n-302, text: "Without a session, eg replies **302** to GitLab OIDC. Login is a separate sequence diagram.", x: 52, y: 560, w: 216, h: 100}
  - {id: n-spa, text: "The SPA's fetch() runs in the **browser**: /api goes back through eg as [3], never pod to pod.", x: 52, y: 700, w: 216, h: 110}
  - {id: n-apply, text: "Argo CD, VSO and CNPG act through the **kube-apiserver**: they write objects, never talk to pods.", x: 52, y: 850, w: 216, h: 110}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true, x: 40, y: 1860, w: 560, h: 380}
  - id: card-data-plane
    title: "Request path · data plane"
    color: cyan
    x: 630
    y: 1860
    w: 820
    h: 380
    lines:
      - "A signed-in user calls <app-a>, whose backend needs <app-b>."
      - "[1] Browser sends GET https://<app-a>.staging.acme.example/api/v1/…. DNS wildcard points to the edge team FIP. the edge team nginx terminates TLS."
      - "[2] the edge team forwards plain HTTP to NodePort 30080 on any worker (static Endpoints, maintained by hand)."
      - "[3] eg matches the HTTPRoute by Host, checks the GitLab id-token cookie against allowedGroups, proxies /api to <app-a>-backend."
      - "[4] <app-a>-backend queries <app-a>-db."
      - "[5] It calls http://<app-b>.staging.acme.example/api from APP_B_URL. hostAliases pins that name to eg-internal: no OIDC, /api only."
      - "[6] eg-internal proxies to <app-b>-backend. [7] It queries <app-b>-db."
      - "Cilium drops everything else: frontend to backend, <app-a> to <app-b> pod to pod, <app-a> to <app-b>-db."
  - id: card-control-plane
    title: "Background · control plane"
    color: violet
    x: 1480
    y: 1860
    w: 900
    h: 380
    lines:
      - "[A] A developer pushes. GitLab CI builds and pushes vX.Y.Z-rc.N images to the registry."
      - "[B] Image Updater polls the registry for new rc tags. [C] It commits the tag to app-configs."
      - "[D] Argo CD pulls infra + generic-app-chart + app-configs and applies each app namespace. Platform baseline values load last and win."
      - "[E] Kubelets pull the images with a read-only pull secret synced from Vault."
      - "[F] VSO authenticates with its ServiceAccount, reads kvv2 and writes plain K8s Secrets into app namespaces."
      - "[G] Dagster triggers Airbyte syncs. [H] Airbyte reads each app DB replica as bi_reader. [I] It loads bi-warehouse."
      - "Admins reach the API server and Talos API only through Boundary. No SSH, no public FIP."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    x: 2410
    y: 1860
    w: 950
    h: 380
    lines:
      - "!!G1!! **Storage and transport.** Docs: Cinder CSI + WAL backups to Ceph S3. Code: local-path only (node-pinned), CNPG backup off. TLS ends at the edge team. the edge team to NodePort and Vault run plain HTTP."
      - "!!G2!! **Isolation.** Docs: staging and prod physically separated. Code: same subnet 10.20.0.0/24, security groups only. NodePorts 30000-32767 open to 0.0.0.0/0: any host on the subnet reaches eg without the edge team."
      - "!!G3!! **Missing services.** RabbitMQ, the observability stack and the Clock are documented, not deployed. Chart rules for RabbitMQ egress and Prometheus ingress target absent namespaces."
      - "!!G4!! **Secret scoping.** Every Vault role is bound to VSO's ServiceAccount. Per-app scoping relies on the baseline pinning vaultRole (ADR-0001), not on Vault."
      - "!!G5!! **East-west auth.** eg-internal has no SecurityPolicy: any app can call any app's /api, the callee cannot identify the caller."
      - "Sizing: docs say m1.medium workers, Terraform provisions m1.large. Leftover empty namespaces: my-app, app-templates."
