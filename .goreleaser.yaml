version: 2

project_name: noodle

builds:
  - id: noodle
    main: ./cmd/noodle
    binary: noodle
    env:
      - CGO_ENABLED=0
    flags:
      - -mod=vendor
      - -trimpath
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - id: noodle
    formats: [tar.gz]
    name_template: "noodle_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE

checksum:
  name_template: "noodle_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  disable: true

release:
  disable: true
