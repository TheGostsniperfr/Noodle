name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and test
        run: go vet ./... && go test ./...
      - name: lint reference example
        run: go run ./cmd/noodle examples/cnp-runtime/runtime-request-path.yaml && go run ./cmd/noodle render examples/cnp-runtime --view runtime && go run ./cmd/noodle render examples/cnp-runtime --view oidc-login && go run ./cmd/noodle render examples/sequence-basics
      - name: lint regression fixtures
        run: for f in examples/platform-regression/*.yaml; do go run ./cmd/noodle -icons examples/platform-regression/icons "$f"; done
      - name: lint docs diagrams
        run: for f in docs/diagrams/specs/*.yaml; do go run ./cmd/noodle -icons docs/diagrams/icons "$f"; done
      - name: features.json keeps its history
        run: ./scripts/check-features.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: vendor directory matches go.mod
        run: go mod vendor && git diff --exit-code -- vendor
