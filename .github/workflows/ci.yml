name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and test
        run: go vet ./... && go test ./...
      - name: lint reference example
        run: go run ./cmd/noodle render examples/cnp-runtime --view runtime && go run ./cmd/noodle render examples/cnp-runtime --view oidc-login && go run ./cmd/noodle render examples/sequence-basics && go run ./cmd/noodle render examples/landscape --view stack && go run ./cmd/noodle render examples/catalog --view catalog
      - name: lint access example
        run: for v in cmp-current cmp-target cmp-diff alice-diff vault-a platform; do go run ./cmd/noodle render examples/access --view $v; done && for l in cmp-current cmp-target alice-current alice-target root; do go run ./cmd/noodle render examples/access --view platform -lens $l; done
      - name: lint regression fixtures
        run: for d in platform-overview app-runtime-view repo-map; do go run ./cmd/noodle render examples/platform-regression/$d -icons examples/platform-regression/icons; done
      - name: lint docs diagrams
        run: go run ./cmd/noodle render docs/diagrams/contract-pipeline -icons docs/diagrams/icons
      - name: features.json keeps its history
        run: ./scripts/check-features.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: vendor directory matches go.mod
        run: go mod vendor && git diff --exit-code -- vendor
