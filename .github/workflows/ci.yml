name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: vet and test
        run: make vet test
      - name: lint examples, regression fixtures and docs diagrams
        run: make examples
      - name: features.json keeps its history and every new pass has evidence
        run: make features BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: specs, ADRs and the command reference are consistent
        run: make spec-check
      - name: vendor directory matches go.mod
        run: make vendor-check
