name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and test
        run: go vet ./... && go test ./...
      - name: lint reference example
        run: go run ./cmd/noodle examples/cnp-runtime/runtime-request-path.yaml
      - name: features.json keeps its history
        run: ./scripts/check-features.sh "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: vendor directory matches go.mod
        run: go mod vendor && git diff --exit-code -- vendor
