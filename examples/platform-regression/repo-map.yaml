id: gitlab-repos
title: "Acme · GitLab repositories"
subtitle: "Where do I commit to change something, and what reads that repository?"
meta:
  - "Scope: GitLab group acme as provisioned by platform/gitlab-provisioning (Terraform), as of 2026-09-27 · consumers from platform/infra Argo CD Applications"
  - "Out of scope: branch protections and approval rules per repo · CI pipeline internals · personal forks"
  - "v0.1 · source: examples/platform-regression/repo-map.yaml · anonymized from a real platform, kept as a regression fixture"
width: 3000
height: 2400

zones:
  - {id: z-teams, kind: region, color: slate, icon: user, label: "TEAMS", x: 40, y: 220, w: 240, h: 1760}
  - {id: z-gitlab, kind: region, color: orange, icon: gitlab, label: "GITLAB · acme", sub: "git.acme.example/acme · tree managed as code by platform/gitlab-provisioning", x: 340, y: 220, w: 1900, h: 1760}
  - {id: g-applications, kind: group, color: indigo, icon: gitlab, label: "APPLICATIONS", sub: "applications/ · owner: each app team", x: 380, y: 290, w: 1820, h: 190}
  - {id: g-devops, kind: group, color: emerald, icon: gitlab, label: "DEVOPS", sub: "devops/", x: 380, y: 540, w: 1820, h: 190}
  - {id: g-bi, kind: group, color: sky, icon: gitlab, label: "BI", sub: "bi/ · owner: BI team", x: 380, y: 790, w: 1820, h: 190}
  - {id: g-platform, kind: group, color: violet, icon: gitlab, label: "PLATFORM", sub: "platform/ · owner: platform team", x: 380, y: 1040, w: 1820, h: 700}
  - {id: g-deploy, kind: group, color: violet, icon: argo, label: "GITOPS · DEPLOYMENT STATE", sub: "read by Argo CD", x: 410, y: 1090, w: 1420, h: 190}
  - {id: g-prov, kind: group, color: amber, icon: openstack, label: "PROVISIONING · IAC", x: 410, y: 1340, w: 700, h: 180}
  - {id: g-products, kind: group, color: cyan, icon: k8s-deploy, label: "PLATFORM PRODUCTS", x: 1170, y: 1340, w: 1000, h: 180}
  - {id: g-docs, kind: group, color: slate, icon: gitlab, label: "DOCS", x: 410, y: 1580, w: 370, h: 140}
  - {id: g-tooling, kind: group, color: emerald, icon: gitlab, label: "TOOLING", x: 840, y: 1580, w: 370, h: 140}
  - {id: g-urbaniste, kind: group, color: rose, icon: gitlab, label: "URBANISTE", sub: "urbaniste/", x: 380, y: 1800, w: 700, h: 150}
  - {id: g-auth, kind: group, color: rose, icon: gitlab, label: "_AUTH-ROLES", sub: "identity groups, no code", x: 1140, y: 1800, w: 1060, h: 150}
  - {id: z-targets, kind: region, color: cyan, icon: rack, label: "WHAT READS IT", x: 2300, y: 220, w: 660, h: 1760}

nodes:
  - {id: app-team, kind: frontend, shape: actor, icon: user, title: "App team", desc: "booking, ticketing…", x: 124, y: 402, w: 56, h: 56}
  - {id: devops-team, kind: frontend, shape: actor, icon: user, title: "DevOps team", x: 124, y: 607, w: 56, h: 56}
  - {id: bi-team, kind: frontend, shape: actor, icon: user, title: "BI team", x: 124, y: 857, w: 56, h: 56}
  - {id: platform-team, kind: frontend, shape: actor, icon: user, title: "platform team", x: 124, y: 1122, w: 56, h: 56}

  - {id: app-repo, kind: external, icon: gitlab, title: "applications/<app>", badge: G1, tech: "[1 repo per app · 7 apps + app-sandbox]", desc: "App code, tests, Dockerfile, .gitlab-ci.yml", x: 420, y: 360, w: 340, h: 90}

  - {id: ci-cd-templates, kind: external, icon: gitlab, title: "ci-cd-templates", tech: "[GitLab CI includes]", desc: "Build, test, scan, push jobs", x: 420, y: 610, w: 340, h: 90}
  - {id: app-templates, kind: external, icon: gitlab, title: "app-templates", tech: "[FastAPI + Vite boilerplate]", desc: "Starting point of every app repo", x: 800, y: 610, w: 340, h: 90}
  - {id: cmp, kind: external, icon: gitlab, title: "cmp", tech: "[developer portal]", desc: "Cloud Management Platform UI", x: 1180, y: 610, w: 340, h: 90}

  - {id: bi-repo, kind: external, icon: gitlab, title: "bi/<tool>", tech: "[airbyte · dagster · metabase]", desc: "Connectors, pipelines, dashboards", x: 420, y: 860, w: 340, h: 90}

  - {id: app-configs, kind: database, icon: gitlab, title: "app-configs", tech: "[apps/<app>/values-<env>.yaml]", desc: "Team-owned: image, env, replicas", x: 440, y: 1160, w: 310, h: 90}
  - {id: generic-app-chart, kind: database, icon: gitlab, title: "generic-app-chart", tech: "[Helm chart]", desc: "One chart for every app", x: 790, y: 1160, w: 310, h: 90}
  - {id: infra, kind: database, icon: gitlab, title: "infra", tech: "[gitops/apps · clusters · terraform]", desc: "Platform + per-app baseline", x: 1140, y: 1160, w: 310, h: 90}
  - {id: base-images, kind: database, icon: gitlab, title: "base-images", tech: "[python-secure · nginx-secure]", desc: "Hardened FROM images", x: 1490, y: 1160, w: 310, h: 90}

  - {id: gitlab-provisioning, kind: cloud, icon: gitlab, title: "gitlab-provisioning", tech: "[Terraform]", desc: "Groups, repos, members", x: 440, y: 1400, w: 310, h: 90}
  - {id: openstack-provisioning, kind: cloud, icon: gitlab, title: "openstack-provisioning", tech: "[Terraform · Talos]", desc: "VMs, network, security groups", x: 780, y: 1400, w: 310, h: 90}

  - {id: clock-service, kind: external, icon: gitlab, title: "clock-service", badge: G2, tech: "[platform service]", desc: "Simulated time", x: 1200, y: 1400, w: 290, h: 90}
  - {id: actors-simulator, kind: external, icon: gitlab, title: "actors-simulator", badge: G2, tech: "[platform service]", desc: "Passengers, airports, IATA", x: 1520, y: 1400, w: 290, h: 90}
  - {id: platform-sdk, kind: external, icon: gitlab, title: "platform-sdk", badge: G2, tech: "[library]", desc: "Broker client for apps", x: 1840, y: 1400, w: 290, h: 90}

  - {id: platform-docs, kind: external, icon: gitlab, title: "platform-docs", tech: "[Markdown]", desc: "Platform docs, these diagrams", x: 440, y: 1620, w: 310, h: 80}
  - {id: renovate-bot, kind: external, icon: gitlab, title: "renovate-bot", tech: "[scheduled pipeline]", desc: "Dependency update MRs", x: 870, y: 1620, w: 310, h: 80}

  - {id: architecture-docs, kind: external, icon: gitlab, title: "architecture-docs", tech: "[ADRs · standards]", desc: "Cross-team decisions", x: 420, y: 1850, w: 340, h: 80}
  - {id: auth-roles, kind: security, icon: gitlab, title: "auth-roles/*", tech: "[GitLab groups · role-* · members]", desc: "OIDC claims for Argo CD, Envoy, Grafana", x: 1180, y: 1850, w: 500, h: 80}

  - {id: registry, kind: database, icon: gitlab, title: "Container registry", tech: "[registry.acme.example]", desc: "vX.Y.Z-rc.N images per app", x: 2360, y: 380, w: 540, h: 100}
  - {id: argocd, kind: backend, icon: argo, title: "Argo CD + Image Updater", tech: "[staging and prod clusters]", desc: "Syncs cluster state from Git", x: 2360, y: 1150, w: 540, h: 110}
  - {id: gitlab-settings, kind: external, icon: gitlab, title: "GitLab itself", tech: "[groups · projects · members]", desc: "Applied by terraform apply", x: 2360, y: 1400, w: 540, h: 90}
  - {id: openstack, kind: cloud, icon: openstack, title: "OpenStack tenant", tech: "[private cloud]", desc: "Talos VMs, network", x: 2360, y: 1620, w: 540, h: 90}

edges:
  # Nominal path: a code change reaching the cluster.
  - {id: e-1-app-team-app-repo, kind: flow, from: app-team, to: app-repo, port: "TCP 22", label: "[1] git push · SSH", path: [[180, 430], [420, 430]]}
  - {id: e-2-app-repo-registry, kind: flow, from: app-repo, to: registry, port: "TCP 443", label: "[2] CI builds + pushes image · HTTPS", path: [[760, 445], [2360, 445]]}
  - {id: e-3-argocd-app-configs, kind: async, from: argocd, to: app-configs, port: "TCP 22", against_flow: true, label: "[3] Image Updater commits the new tag · SSH", label_at: [1500, 1310], path: [[2400, 1260], [2400, 1310], [605, 1310], [605, 1250]]}
  - {id: e-4-argocd-deploy, kind: async, from: argocd, to: g-deploy, against_flow: true, label: "[4] pull + render + apply · SSH", path: [[2360, 1200], [1830, 1200]]}

  # Who commits where.
  - {id: e-app-team-app-configs, kind: flow, from: app-team, to: app-configs, port: "TCP 22", label: "MR on values-staging.yaml", label_at: [300, 1010], path: [[180, 450], [300, 450], [300, 1225], [440, 1225]]}
  - {id: e-devops-team, kind: flow, from: devops-team, to: g-devops, label: "commit · MR", label_at: [235, 635], path: [[180, 635], [380, 635]]}
  - {id: e-bi-team, kind: flow, from: bi-team, to: g-bi, label: "commit · MR", label_at: [235, 885], path: [[180, 885], [380, 885]]}
  - {id: e-platform-team, kind: flow, from: platform-team, to: g-platform, label: "commit · MR", label_at: [235, 1150], path: [[180, 1150], [380, 1150]]}

  # Provisioning pipelines.
  - {id: e-gitlab-prov-apply, kind: async, from: gitlab-provisioning, to: gitlab-settings, port: "TCP 443", label: "terraform apply · GitLab API", label_at: [760, 1540], path: [[595, 1490], [595, 1540], [2330, 1540], [2330, 1470], [2360, 1470]]}
  - {id: e-openstack-prov-apply, kind: async, from: openstack-provisioning, to: openstack, port: "TCP 443", label: "terraform apply · OpenStack API", label_at: [1700, 1555], path: [[935, 1490], [935, 1555], [2345, 1555], [2345, 1690], [2360, 1690]]}

  # References between repos.
  - {id: r-app-repo-ci-templates, kind: link, from: app-repo, to: ci-cd-templates, label: "include:project", path: [[600, 450], [600, 610]]}
  - {id: r-app-repo-app-templates, kind: link, from: app-repo, to: app-templates, label: "bootstrapped from", label_at: [850, 510], path: [[740, 450], [740, 510], [960, 510], [960, 610]]}
  - {id: r-bi-argocd, kind: link, from: g-bi, to: argocd, label: "repoURL (bi/*)", label_at: [2270, 1000], path: [[2200, 885], [2270, 885], [2270, 1120], [2450, 1120], [2450, 1150]]}

notes:
  - {id: n-apps, text: "Same layout in every app repo: generated from **app-templates**, CI from **ci-cd-templates**, images FROM **base-images**.", x: 860, y: 355, w: 760, h: 70}
  - {id: n-bi, text: "One repo per BI tool. Its namespace, route and network policy live in **platform/infra**.", x: 860, y: 860, w: 620, h: 70}

cards:
  - {id: card-legend, title: "Legend", color: slate, legend: true, x: 40, y: 2040, w: 500, h: 320}
  - id: card-where
    title: "I want to change… → commit in"
    color: indigo
    x: 560
    y: 2040
    w: 1180
    h: 320
    lines:
      - "**My app's code, tests, Dockerfile, CI** → applications/<app> (app team)."
      - "**My app's image tag, env vars, replicas in staging** → platform/app-configs, apps/<app>/values-staging.yaml (app team MR). Prod values need platform approval (CODEOWNERS)."
      - "**Security settings, probes, secrets list, route, allowed groups** → platform/infra, gitops/apps/<app>/ (platform team). The baseline loads last and wins."
      - "**A new secret value** → Vault, via the platform team. Never in Git."
      - "**A CI job for everyone** → devops/ci-cd-templates. **A new app** → start from devops/app-templates."
      - "**What the chart renders for every app** → platform/generic-app-chart. **A base image** → platform/base-images."
      - "**BI connectors, pipelines, dashboards** → bi/<tool>."
      - "**Someone's GitLab access or a new repo** → platform/gitlab-provisioning. **VMs, network, security groups** → platform/openstack-provisioning."
      - "**Platform docs** → platform/platform-docs. **Cross-team standards, ADRs** → urbaniste/architecture-docs."
  - id: card-steps
    title: "From commit to cluster"
    color: cyan
    x: 1760
    y: 2040
    w: 640
    h: 320
    lines:
      - "[1] The app team pushes to applications/<app>."
      - "[2] Its pipeline (ci-cd-templates) builds and pushes a vX.Y.Z-rc.N image."
      - "[3] Image Updater sees the new tag and commits it to app-configs."
      - "[4] Argo CD pulls app-configs, generic-app-chart and infra, renders the app and applies it."
      - "Stacked boxes: one repo per app or per tool, same shape."
  - id: card-gaps
    title: "Gaps between docs and code"
    color: orange
    x: 2420
    y: 2040
    w: 540
    h: 320
    lines:
      - "!!G1!! **Apps.** flight-tracking has a repo but no Argo CD Application. app-sandbox exists but is not in the docs tree."
      - "!!G2!! **Products.** clock-service, actors-simulator and platform-sdk repos exist. Nothing from them is deployed."
      - "**Docs tree** (gitlab-structure.md) misses app-configs, bi/, urbaniste/ and the members role group."
