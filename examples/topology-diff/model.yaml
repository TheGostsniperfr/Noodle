  - {id: c-envoy-api, from: envoy, to: api, port: http, protocol: HTTP, verb: proxy, kind: flow}
  - {id: c-grafana-prometheus, from: grafana, to: prometheus, port: web, protocol: HTTP, verb: PromQL, kind: flow}
  - {id: c-grafana-loki, from: grafana, to: loki, port: http, protocol: HTTP, verb: LogQL, kind: flow}
  - {id: c-prometheus-api, from: prometheus, to: api, port: http, protocol: HTTP, verb: scrape, kind: async, status: planned, target: SP2}
  - {id: c-prometheus-alertmanager, from: prometheus, to: alertmanager, port: web, protocol: HTTP, verb: alerts, kind: flow}
  - {id: c-alertmanager-discord, from: alertmanager, to: discord, port: https, protocol: HTTPS, verb: webhook, kind: flow, status: planned, target: SP2}
  - {id: c-alloy-loki, from: alloy, to: loki, port: http, protocol: HTTP, verb: push, kind: async}
  - {id: c-fluentbit-elastic, from: fluentbit, to: elastic, port: http, protocol: HTTP, verb: bulk, kind: async}
references:
  - {id: r-alloy-api, from: alloy, to: api, kind: tails logs}
